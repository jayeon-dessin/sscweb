<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>세소찾더보기</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"
  />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>세소찾 더보기</h1>
  <p>
    테스트:
    <span class="fi fi-de"></span>
    독일
    <span class="fi fi-fr"></span>
    프랑스
    <span class="fi fi-jp"></span>
    일본
  </p>
  <p class="site-description">
  여러 나라의 음악을 국가별로 찾아볼 수 있는 개인 음악 아카이브입니다. 음악 선정에는 개인 취향이 (많이) 반영됩니다. 곡 추천: leecm0070@gmail.com
  </p>

  <!-- 첫 화면: 국가 목록 -->
  <div id="country-view">
    <div id="country-list"></div>
  </div>

  <!-- 국가 선택 후: 곡 목록 -->
  <div id="songs-view" style="display: none;">

    <button id="back-to-countries">
      ← 국가 선택으로
    </button>

    <h2 id="country-title"></h2>

    <div class="filter-bar">
      <label for="artist-filter">Artist</label>
      <select id="artist-filter">
        <option value="all">전체</option>
      </select>

      <label for="language-filter">Language</label>
      <select id="language-filter">
        <option value="all">전체</option>
      </select>
    </div>

    <div class="search-bar">
      <input
        type="text"
        id="tag-search"
        placeholder="검색"
      />
    </div>

    <div id="song-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
