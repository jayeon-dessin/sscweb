<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세소찾더보기</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"
  />
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="site-title-box">
      <h1>세소찾 더보기</h1>
    </div>
    <div class="site-description-box">
      <p>전 세계의 음악을 찾아볼 수 있는 개인 음악 아카이브입니다.</p>
      <p>음악 선정에는 개인 취향이 (많이) 반영됩니다.</p>
      <p>곡 추천: leecm0070@gmail.com</p>
    </div>
  </header>
  <p id="archive-stats"></p>
  <div id="flag-strip"></div>

  <!-- 항상 표시되는 검색창 -->
  <div class="search-bar">
    <input
      type="text"
      id="tag-search"
      aria-label="곡, 아티스트, 작곡·작사자, 언어, 태그, 설명 검색"
      placeholder="곡, 아티스트, 작곡·작사자, 언어, 태그, 설명 검색"
    />
  </div>

  <!-- 목록/지도/버블/랜덤 뷰 전환 -->
  <div class="view-mode-tabs" role="tablist" aria-label="국가 보기 방식">
    <button
      type="button"
      class="view-tab active"
      data-mode="countries"
      role="tab"
      aria-selected="true"
    >
      목록
    </button>
    <button
      type="button"
      class="view-tab"
      data-mode="map"
      role="tab"
      aria-selected="false"
    >
      지도
    </button>
    <button
      type="button"
      class="view-tab"
      data-mode="random"
      role="tab"
      aria-selected="false"
    >
      랜덤 곡
    </button>
  </div>

  <!-- 국가 선택: 목록 -->
  <div id="country-view">

    <div class="country-controls">
      <label for="country-sort">국가 정렬</label>

      <select id="country-sort">
        <option value="name">가나다순</option>
        <option value="count-desc">곡 많은 순</option>
        <option value="count-asc">곡 적은 순</option>
      </select>
    </div>

    <div id="country-list"></div>

  </div>

  <!-- 국가 선택: 지도 -->
  <div id="map-view" style="display: none;">

    <div id="map-container">
      <svg id="world-map" viewBox="0 0 960 500" role="img" aria-label="세계지도. 곡이 있는 국가를 클릭하면 해당 국가의 곡 목록으로 이동합니다."></svg>
      <button type="button" id="map-reset-zoom" title="지도 처음으로">
        전체 보기
      </button>
      <button type="button" id="map-unclassified-button" class="hidden">
        미분류
      </button>
    </div>

  </div>

  <!-- 랜덤 곡 -->
  <div id="random-view" style="display: none;">
    <section id="random-song"></section>
  </div>

  <!-- 국가 선택 후: 곡 목록 -->
  <div id="songs-view" style="display: none;">
    <button id="back-to-countries">
      ← 국가/지역 선택으로
    </button>
    <h2 id="country-title"></h2>
    <div id="song-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="geo-data.js"></script>
  <script src="album-art.js"></script>
  <script src="script.js"></script>
  <script src="map.js"></script>
</body>
</html>
