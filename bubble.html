<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버블 뷰 - 세소찾더보기</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"
  />
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bubble-page">

  <header class="site-header bubble-page-header">
    <div class="site-title-box">
      <a href="index.html" class="bubble-back-link">← 세소찾 더보기</a>
    </div>
  </header>

  <!--
    아래 요소들은 화면에는 안 보이지만, script.js/map.js가 index.html과
    공용으로 쓰는 코드라 이 id들이 존재한다고 가정합니다. 실제 내용/동작은
    이 페이지에서는 쓰지 않고, 그냥 에러 없이 조용히 무시되도록 최소한만 둡니다.
  -->
  <div class="controls-row" style="display: none;">
    <div class="search-bar">
      <input type="text" id="tag-search" tabindex="-1" aria-hidden="true" />
    </div>
    <div class="view-mode-tabs"></div>
  </div>

  <div id="flag-strip" style="display: none;"></div>

  <div id="country-view" style="display: none;">
    <div class="country-controls">
      <select id="country-sort">
        <option value="name">가나다순</option>
        <option value="count-desc">곡 많은 순</option>
        <option value="count-asc">곡 적은 순</option>
        <option value="continent">대륙별</option>
      </select>
    </div>
    <div id="country-list"></div>
  </div>

  <div id="map-view" style="display: none;"></div>

  <div id="timeline-view" style="display: none;">
    <select id="timeline-sort">
      <option value="asc">오래된순</option>
      <option value="desc">최신순</option>
    </select>
    <div id="timeline-list"></div>
  </div>

  <div id="tags-view" style="display: none;">
    <select id="tag-sort">
      <option value="count-desc">많이 쓰인 순</option>
      <option value="name">가나다순</option>
    </select>
    <div id="tags-list"></div>
  </div>

  <div id="about-view" style="display: none;">
    <p class="about-stat-badge" id="about-stat-badge"></p>
  </div>

  <!-- 곡 유사도 버블 뷰 (실제로 보여줄 화면 - 화면 전체를 씀) -->
  <div id="bubble-view">

    <div class="bubble-controls">
      <p class="bubble-hint">
        비슷한 곡끼리(같은 아티스트·작곡가·언어·태그·인접 국가) 가까이 모여요. 버블을 한 번 클릭하면 옆에 미리보기가 뜨고, 같은 버블을 한 번 더 클릭하면 그 곡으로 이동해요. 드래그해서 옮길 수도 있어요.
      </p>
    </div>

    <div class="bubble-main-row">

      <div id="bubble-container">
        <svg id="bubble-svg" viewBox="0 0 1000 640" role="img" aria-label="곡 유사도에 따라 배치된 버블 그래프. 버블을 한 번 클릭하면 미리보기가 나오고, 같은 버블을 다시 클릭하면 그 곡으로 이동합니다."></svg>
        <div class="bubble-buttons">
          <button type="button" id="bubble-reset-layout" title="버블 위치를 다시 계산해서 정리해요">
            버블 재배치
          </button>
          <button type="button" id="bubble-reset-zoom" title="확대/축소를 원래대로">
            확대 원래대로
          </button>
        </div>
      </div>

      <div id="bubble-preview" class="hidden">
        <div class="bubble-preview-artwork placeholder"></div>
        <div class="bubble-preview-body">
          <h3 id="bubble-preview-title"></h3>
          <p id="bubble-preview-artist"></p>
          <p id="bubble-preview-meta"></p>
          <p class="bubble-preview-hint">버블을 한 번 더 클릭하면 곡 상세로 이동해요</p>
        </div>
      </div>

    </div>

  </div>

  <!-- 버블 클릭 -> 곡 상세로 이동했을 때 보여줄 화면 (index.html과 동일) -->
  <div id="songs-view" style="display: none;">
    <div class="songs-view-header">
      <button id="back-to-countries">
        ← 돌아가기
      </button>
      <h2 id="country-title"></h2>
    </div>
    <div id="song-list"></div>
  </div>

  <script>
    // 이 페이지는 항상 버블 뷰로 시작 (script.js의 URL 상태 복원 로직이
    // "view=bubble"을 그대로 알아듣게, 로드 전에 미리 넣어둠)
    if (new URLSearchParams(location.search).get("view") !== "bubble") {
      const params = new URLSearchParams(location.search);
      params.set("view", "bubble");
      history.replaceState(null, "", `bubble.html?${params.toString()}`);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="geo-data.js"></script>
  <script src="album-art.js"></script>
  <script src="script.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
